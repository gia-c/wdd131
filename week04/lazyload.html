<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Gisela Casas">
    <meta name="description" content="WDD 131 Week 04 Lazy Loading Activity">
    <title>Lazy Loading Images</title>
    <link rel="stylesheet" href="styles/lazyload.css">
    <script src="scripts/lazyload.js" defer></script>
</head>

<body>
    <main>
        <h1>Lazy Loading Images</h1>

        <img src="https://picsum.photos/400/600?random=1"
            alt="Random portrait image 1"
            width="400"
            height="600"
            loading="lazy">

        <img src="https://picsum.photos/400/600?random=2"
             alt="Random portrait image 1"
             width="400"
             height="600"
             loading="lazy">

        <img src="https://picsum.photos/400/600?random=3"
             alt="Random portrait image 2"
             width="400"
             height="600"
             loading="lazy">

        <img src="https://picsum.photos/400/600?random=4"
             alt="Random portrait image 3"
             width="400"
             height="600"
             loading="lazy">

        <img src="https://picsum.photos/400/600?random=5"
             alt="Random portrait image 4"
             width="400"
             height="600"
             loading="lazy">

        <img src="https://picsum.photos/400/600?random=6"
             alt="Random portrait image 5"
             width="400"
             height="600"
             loading="lazy">
    </main>

    <footer>
        <p>&copy; 2026 Gisela Casas | Last Modified: <span id="lastModified"></span></p>
    </footer>
</body>
</html>
