<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables and Objects</title>
    <link rel="stylesheet" href="styles/Tables-Objects.css">
    <script src="scripts/Tables-Objects.js" defer></script>
</head>
<body>

    <h1>JavaScript Tables</h1>

    <table>
    <thead>
        <tr>
        <th colspan="4">ACME Wildwest Services</th>
        </tr>
        <tr>
        <td class="blank"></td>
        <th>Basic</th>
        <th>Premium</th>
        <th>Deluxe</th>
        </tr>
    </thead>
    <tbody>
        <tr>
        <th>Feature 1</th>
        <td>✔️</td>
        <td>✔️</td>
        <td>✔️</td>
        </tr>
        <tr>
        <th>Feature 2</th>
        <td>❌</td>
        <td>✔️</td>
        <td>✔️</td>

        </tr>
        <tr>
        <th>Feature 3</th>
        <td>❌</td>
        <td>❌</td>
        <td>✔️</td>
        </tr>
    </tbody>

    <caption>Table 1: Account Feature Comparison</caption>
    </table>


    <h2>JavaScript Objects</h2>

    <table id="sections">
    <caption id="courseName"></caption>
    <thead>
        <tr>
        <th>Section</th>
        <th>Enrollment</th>
        <th>Instructor</th>
        </tr>
    </thead>
    <tbody></tbody>
    </table>


</body>
</html>
