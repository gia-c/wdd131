<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A basic site of Peru, including location information and current weather conditions.">
    <meta name="author" content="Gisela Casas">
    <title>Peru | Place</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Nunito:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="styles/place.css">
    <script src="scripts/place.js" defer></script>
</head>

<body>
    <header>
        <h1>Peru</h1>
    </header>

    <main>
        <section class="hero">
            <picture>
                <source
                    media="(min-width: 768px)"
                    srcset="images/hero-large.webp" media="(min-width: 1000px)">
                    <source srcset="images/hero-medium.webp" media="(min-width: 550px)">
                <img
                    src="images/hero.webp"
                    alt="View of Macchu Picchu, Peru"
                    width="1500"
                    height="750">
            </picture>
        </section>

        <section class="data-card">
            <h2>Data</h2>

            <div class="data-list">
                <p><span>Area:</span><span>1.285.216 km²</span></p>
                <p><span>Population:</span><span>34.157.732</span></p>
                <p><span>Capital:</span><span>Lima</span></p>
                <p><span>Languages:</span><span>Spanish, Quechua, Aymara</span></p>
                <p><span>Currency:</span><span>Sol</span></p>
                <p><span>Time Zone:</span><span>UTC−05:00</span></p>
                <p><span>Calling code:</span><span>+51</span></p>
                <p><span>Internet TLD:</span><span>.pe</span></p>
            </div>
        </section>

        <section class="weather-card">
            <h2>Weather</h2>

            <img
                class="weather-icon"
                src="images/weather.svg"
                alt="Partly cloudy weather">

            <div class="weather-list">
                <p><span>Temperature:</span><span id="temperature">8 °C</span></p>
                <p><span>Conditions:</span><span>Partly Cloudy</span></p>
                <p><span>Wind:</span><span id="wind">12 km/h</span></p>
                <p><span>Wind Chill:</span><span id="windChill"></span></p>
            </div>
        </section>
    </main>

    <footer>
        <p>
            &copy; <span id="currentYear"></span> ● Gisela Casas ● Peru
        </p>
        <p>
            Last modified: <span id="lastModified"></span>
        </p>
    </footer>
</body>
</html>
