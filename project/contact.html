<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Send a destination suggestion, a correction, or general feedback for the Discover Peru travel guide.">
    <meta name="author" content="Gisela Casas">
    <title>Contact | Discover Peru</title>
    <link rel="icon" href="images/logo.jpg" type="image/jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Nunito:wght@400;600;700&amp;display=swap">
    <link rel="stylesheet" href="styles/site.css">
    <script src="scripts/common.js" defer></script>
</head>
<body>
    <a class="skip-link" href="#main">Skip to main content</a>
    <header class="site-header">
        <a class="brand" href="index.html">
            <img src="images/logo.jpg" alt="" width="56" height="56">
            <span>Discover Peru</span>
        </a>
        <button class="menu-toggle" type="button" aria-controls="main-nav" aria-expanded="false" aria-label="Toggle navigation menu">
            <span class="menu-bar"></span>
            <span class="menu-bar"></span>
            <span class="menu-bar"></span>
        </button>
        <nav class="main-nav" id="main-nav" aria-label="Main">
            <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="destinations.html">Destinations</a></li>
                    <li><a href="favorites.html">Favorites</a></li>
                    <li><a href="contact.html" aria-current="page">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main id="main">
        <section class="section-block contact-section" aria-labelledby="contact-heading">
            <h1 class="section-heading" id="contact-heading">Contact and suggestions</h1>
            <p class="section-intro">Know a place that belongs in Discover Peru? Send me your recommendation, a correction, or any comments about the site.</p>
            <form class="contact-form" action="thankyou.html" method="get">
                <div class="field">
                    <label for="visitor-name">Name</label>
                    <input type="text" id="visitor-name" name="name" autocomplete="name" minlength="2" required>
                </div>
                <div class="field">
                    <label for="visitor-email">Email address</label>
                    <input type="email" id="visitor-email" name="email" autocomplete="email" required>
                </div>
                <div class="field">
                    <label for="message-type">Message type</label>
                    <select id="message-type" name="topic" required>
                        <option value="">Choose one</option>
                        <option value="suggestion">Suggest a destination</option>
                        <option value="correction">Correct information</option>
                        <option value="feedback">General feedback</option>
                    </select>
                </div>
                <div class="field">
                    <label for="destination-name">Destination (optional)</label>
                    <input type="text" id="destination-name" name="destination">
                </div>
                <div class="field">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="6" minlength="10" required></textarea>
                </div>
                <label class="checkbox-line">
                    <input type="checkbox" name="permission" required>
                    <span>I agree that my message may be reviewed to improve future updates of this guide.</span>
                </label>
                <button class="button" type="submit">Send message</button>
            </form>
        </section>
    </main>
    <footer class="site-footer">
        <p id="copyright">© Discover Peru</p>
        <p><a href="attributions.html">Attributions</a></p>
    </footer>
</body>
</html>
